[project]
name = "minio-sync"
version = "3.0.0"
description = "MinIO 对象存储增量同步工具（工程化重构版）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "minio>=7.2.20",
    "schedule>=1.2.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
minio-sync = "minio_sync.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minio_sync"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]